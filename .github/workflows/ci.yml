name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  host:
    name: Host Tests & Quality
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: stable
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Generate dummy secrets.rs
        run: cp skylights-app/src/secrets.example.rs skylights-app/src/secrets.rs

      - name: Check code formatting
        run: cargo fmt --all --check

      - name: Run clippy on skylights-core
        run: cargo clippy -p skylights-core --all-targets -- -D warnings

      - name: Run unit tests on skylights-core
        run: cargo test -p skylights-core

  firmware:
    name: Firmware Target Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Xtensa Rust toolchain
        uses: esp-rs/xtensa-toolchain@v1.5
        with:
          default: true
          buildtargets: esp32

      - name: Generate dummy secrets.rs
        run: cp skylights-app/src/secrets.example.rs skylights-app/src/secrets.rs

      - name: Build skylights-app for xtensa-esp32-none-elf
        run: cargo build --package skylights-app --target xtensa-esp32-none-elf -Zbuild-std=core,alloc

      - name: Run clippy on skylights-app
        run: cargo clippy --package skylights-app --target xtensa-esp32-none-elf -Zbuild-std=core,alloc -- -D warnings
