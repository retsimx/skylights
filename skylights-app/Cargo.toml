[package]
name = "skylights-app"
version = "0.1.0"
edition = "2021"
authors = ["retsimx"]
license = "MIT OR Apache-2.0"
description = "ESP32 firmware application for Skylights controller"

[dependencies]
skylights-core = { workspace = true }
esp-hal = { workspace = true }
esp-backtrace = { workspace = true }
esp-println = { workspace = true }
esp-storage = { version = "0.4.0", default-features = false, features = ["esp32", "nor-flash"] }
esp-hal-embassy = { version = "0.6.0", features = ["esp32"] }
embassy-executor = { workspace = true, features = ["task-arena-size-8192"] }
embassy-time = { workspace = true }
embassy-sync = { workspace = true }
embassy-futures = { workspace = true }

embedded-storage = { version = "0.3", default-features = false }
embedded-alloc = "0.7.0"

[build-dependencies]
skylights-core = { path = "../skylights-core", default-features = false }

