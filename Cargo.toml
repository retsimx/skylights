[workspace]
members = [
    "skylights-core",
    "skylights-app",
]
resolver = "2"

[workspace.dependencies]
embassy-executor = { version = "0.7", default-features = false }
embassy-time = { version = "0.4", default-features = false }
embassy-sync = { version = "0.6", default-features = false }
embassy-net = { version = "0.8.0", default-features = false }
embassy-futures = "0.1"
embedded-io-async = "0.6"
static_cell = "2"
sha2 = { version = "0.10", default-features = false }
minimq = { version = "0.13", default-features = false }
serde = { version = "1.0", default-features = false, features = ["derive"] }
serde-json-core = "0.5"
defmt = "0.3"
esp-hal = { version = "0.23.1", default-features = false, features = ["esp32", "unstable"] }
esp-wifi = { version = "0.12", features = ["wifi", "esp32"] }
esp-alloc = "0.6"
esp-backtrace = { version = "0.15.1", default-features = false, features = ["esp32", "panic-handler", "println"] }
esp-println = { version = "0.13.1", default-features = false, features = ["esp32", "defmt-espflash", "auto"] }
skylights-core = { path = "skylights-core" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
debug = 2
incremental = false
overflow-checks = false

[profile.release.package.esp-storage]
opt-level = 3

[profile.dev]
opt-level = 3
debug = 2
overflow-checks = true

[profile.dev.package.esp-storage]
opt-level = 3

[profile.dev.package.esp-wifi]
opt-level = 3

